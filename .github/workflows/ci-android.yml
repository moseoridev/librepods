name: Android CI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        if: github.repository == 'librepods-org/librepods' && github.event_name != 'pull_request'
        run: echo "${{ secrets.RELEASE_KEYSTORE_FILE }}" | base64 --decode > android/release.keystore
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Licenses
        run: yes | sdkmanager --licenses
      - name: Install NDK
        run: sdkmanager "ndk;30.0.14904198"
      - name: Create local.properties
        if: github.repository == 'librepods-org/librepods' && github.event_name != 'pull_request'
        run: |
          cat <<EOF > android/local.properties
          RELEASE_STORE_FILE=../release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF
      - name: Build and test FOSS debug for development
        if: github.repository != 'librepods-org/librepods' || github.event_name == 'pull_request'
        run: ./gradlew :app:testFossDebugUnitTest :app:assembleFossDebug :core:testDebugUnitTest :settings-ui:testDebugUnitTest
        working-directory: android
      - name: Build release artifacts
        if: github.repository == 'librepods-org/librepods' && github.event_name != 'pull_request'
        run: ./gradlew collectReleaseArtifacts
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: github.repository == 'librepods-org/librepods' && github.event_name != 'pull_request'
        with:
          name: apk-release
          path: release/*release.apk

      - uses: actions/upload-artifact@v4
        if: github.repository != 'librepods-org/librepods' || github.event_name == 'pull_request'
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/foss/debug/app-foss-debug.apk

      - uses: actions/upload-artifact@v4
        if: github.repository == 'librepods-org/librepods' && github.event_name != 'pull_request'
        with:
          name: apk-debug
          path: release/*debug.apk

      - uses: actions/upload-artifact@v4
        if: github.repository == 'librepods-org/librepods' && github.event_name != 'pull_request'
        with:
          name: root-module-release
          path: release/*release.zip

      - uses: actions/upload-artifact@v4
        if: github.repository == 'librepods-org/librepods' && github.event_name != 'pull_request'
        with:
          name: root-module-debug
          path: release/*debug.zip

      - uses: actions/upload-artifact@v4
        if: github.repository == 'librepods-org/librepods' && github.event_name != 'pull_request'
        with:
          name: release-bundle
          path: release/*.aab
